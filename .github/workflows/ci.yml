name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci
        working-directory: backend

      - name: Run backend tests (with coverage)
        run: npm run test:coverage
        working-directory: backend
        env:
          NODE_ENV: test

      - name: Verify backend coverage output
        run: ls -R backend/coverage
      
      - name: Debug backend coverage
        run: |
          echo "=== backend/coverage contents ==="
          ls -la backend/coverage/
          echo "=== lcov.info size ==="
          wc -l backend/coverage/lcov.info    

      - name: Upload Backend Coverage
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./backend/coverage/lcov.info
          flags: backend
          name: backend-coverage
          fail_ci_if_error: true
          verbose: true

  frontend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --legacy-peer-deps
        working-directory: frontend

      - name: Run frontend tests (with coverage)
        run: npm run test:coverage
        working-directory: frontend
        env:
          CI: true

      - name: Debug frontend coverage  
        run: |
          echo "=== frontend/coverage contents ==="
          ls -la frontend/coverage/
          echo "=== lcov.info size ==="
          wc -l frontend/coverage/lcov.info    

      - name: Upload Frontend Coverage
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./frontend/coverage/lcov.info
          flags: frontend
          name: frontend-coverage
          fail_ci_if_error: true
          verbose: true